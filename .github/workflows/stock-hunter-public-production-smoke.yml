name: Stock Hunter Public Production Smoke

on:
  push:
    branches:
      - main
      - 'stock-hunter-v417-public-production-smoke-*'
    paths:
      - 'index.html'
      - 'stock-hunter-v4/**'
      - '.github/workflows/stock-hunter-public-production-smoke.yml'
      - 'stock-hunter-v4/research/PUBLIC_PRODUCTION_SMOKE_AUDIT_2026-09-18.md'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Wait for and fetch published Pages artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/stock-hunter-public-smoke

          fetch() {
            local url="$1"
            local out="$2"
            local code
            code="$(curl -L --silent --show-error --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 30 -w '%{http_code}' -o "$out" "$url")"
            test "$code" = "200"
            test -s "$out"
          }

          specs=(
            "index.html|https://afzalpour.github.io/|root-index.html"
            "stock-hunter-v4/index.html|https://afzalpour.github.io/stock-hunter-v4/|app-index.html"
            "stock-hunter-v4/sw.js|https://afzalpour.github.io/stock-hunter-v4/sw.js|sw.js"
            "stock-hunter-v4/manifest.webmanifest|https://afzalpour.github.io/stock-hunter-v4/manifest.webmanifest|manifest.webmanifest"
            "stock-hunter-v4/app-hunt-carry-v416.js|https://afzalpour.github.io/stock-hunter-v4/app-hunt-carry-v416.js|app-hunt-carry-v416.js"
            "stock-hunter-v4/hunt-runtime-core-v417.js|https://afzalpour.github.io/stock-hunter-v4/hunt-runtime-core-v417.js|hunt-runtime-core-v417.js"
            "stock-hunter-v4/app-runtime-router-v417.js|https://afzalpour.github.io/stock-hunter-v4/app-runtime-router-v417.js|app-runtime-router-v417.js"
            "stock-hunter-v4/app-runtime.js|https://afzalpour.github.io/stock-hunter-v4/app-runtime.js|app-runtime.js"
            "stock-hunter-v4/app-universe.js|https://afzalpour.github.io/stock-hunter-v4/app-universe.js|app-universe.js"
            "stock-hunter-v4/app-universal-search-v416.js|https://afzalpour.github.io/stock-hunter-v4/app-universal-search-v416.js|app-universal-search-v416.js"
            "stock-hunter-v4/styles.css|https://afzalpour.github.io/stock-hunter-v4/styles.css|styles.css"
            "stock-hunter-v4/search-neutral-v416.css|https://afzalpour.github.io/stock-hunter-v4/search-neutral-v416.css|search-neutral-v416.css"
            "stock-hunter-v4/index-v417.html|https://afzalpour.github.io/stock-hunter-v4/index-v417.html|index-v417.html"
            "stock-hunter-v4/app-personal-v417.js|https://afzalpour.github.io/stock-hunter-v4/app-personal-v417.js|app-personal-v417.js"
            "stock-hunter-v4/personal-v417.css|https://afzalpour.github.io/stock-hunter-v4/personal-v417.css|personal-v417.css"
          )

          converged=0
          for attempt in $(seq 1 60); do
            all_ok=1
            for spec in "${specs[@]}"; do
              IFS='|' read -r repo_path url out_name <<< "$spec"
              tmp="/tmp/stock-hunter-public-smoke/$out_name"
              if ! fetch "$url?sha=$GITHUB_SHA&attempt=$attempt" "$tmp"; then
                all_ok=0
                break
              fi
              if ! cmp -s "$repo_path" "$tmp"; then
                all_ok=0
                break
              fi
            done
            if [ "$all_ok" = "1" ]; then
              converged=1
              echo "Published Pages bytes converged to $GITHUB_SHA on attempt $attempt"
              break
            fi
            echo "Published Pages bytes not converged yet (attempt $attempt/60)"
            sleep 5
          done

          if [ "$converged" != "1" ]; then
            echo "::error::GitHub Pages did not converge to repository bytes within the smoke window"
            exit 1
          fi

      - name: Verify deployed bytes equal repository bytes
        run: |
          set -euo pipefail
          cmp index.html /tmp/stock-hunter-public-smoke/root-index.html
          cmp stock-hunter-v4/index.html /tmp/stock-hunter-public-smoke/app-index.html
          cmp stock-hunter-v4/sw.js /tmp/stock-hunter-public-smoke/sw.js
          cmp stock-hunter-v4/manifest.webmanifest /tmp/stock-hunter-public-smoke/manifest.webmanifest
          cmp stock-hunter-v4/app-hunt-carry-v416.js /tmp/stock-hunter-public-smoke/app-hunt-carry-v416.js
          cmp stock-hunter-v4/hunt-runtime-core-v417.js /tmp/stock-hunter-public-smoke/hunt-runtime-core-v417.js
          cmp stock-hunter-v4/app-runtime-router-v417.js /tmp/stock-hunter-public-smoke/app-runtime-router-v417.js
          cmp stock-hunter-v4/app-runtime.js /tmp/stock-hunter-public-smoke/app-runtime.js
          cmp stock-hunter-v4/app-universe.js /tmp/stock-hunter-public-smoke/app-universe.js
          cmp stock-hunter-v4/app-universal-search-v416.js /tmp/stock-hunter-public-smoke/app-universal-search-v416.js
          cmp stock-hunter-v4/styles.css /tmp/stock-hunter-public-smoke/styles.css
          cmp stock-hunter-v4/search-neutral-v416.css /tmp/stock-hunter-public-smoke/search-neutral-v416.css
          cmp stock-hunter-v4/index-v417.html /tmp/stock-hunter-public-smoke/index-v417.html
          cmp stock-hunter-v4/app-personal-v417.js /tmp/stock-hunter-public-smoke/app-personal-v417.js
          cmp stock-hunter-v4/personal-v417.css /tmp/stock-hunter-public-smoke/personal-v417.css

          echo "root_index_sha256=$(sha256sum index.html | awk '{print $1}')"
          echo "app_index_sha256=$(sha256sum stock-hunter-v4/index.html | awk '{print $1}')"
          echo "sw_sha256=$(sha256sum stock-hunter-v4/sw.js | awk '{print $1}')"
          echo "runtime_core_sha256=$(sha256sum stock-hunter-v4/hunt-runtime-core-v417.js | awk '{print $1}')"
          echo "runtime_router_sha256=$(sha256sum stock-hunter-v4/app-runtime-router-v417.js | awk '{print $1}')"
          echo "personal_index_sha256=$(sha256sum stock-hunter-v4/index-v417.html | awk '{print $1}')"
          echo "personal_app_sha256=$(sha256sum stock-hunter-v4/app-personal-v417.js | awk '{print $1}')"
          echo "personal_css_sha256=$(sha256sum stock-hunter-v4/personal-v417.css | awk '{print $1}')"

      - name: Verify published runtime markers
        run: |
          set -euo pipefail
          APP=/tmp/stock-hunter-public-smoke/app-index.html
          SW=/tmp/stock-hunter-public-smoke/sw.js
          CORE=/tmp/stock-hunter-public-smoke/hunt-runtime-core-v417.js
          ROUTER=/tmp/stock-hunter-public-smoke/app-runtime-router-v417.js
          APP_RUNTIME=/tmp/stock-hunter-public-smoke/app-runtime.js
          APP_UNIVERSE=/tmp/stock-hunter-public-smoke/app-universe.js
          SEARCH=/tmp/stock-hunter-public-smoke/app-universal-search-v416.js
          STYLES=/tmp/stock-hunter-public-smoke/styles.css
          SEARCH_NEUTRAL=/tmp/stock-hunter-public-smoke/search-neutral-v416.css
          P417=/tmp/stock-hunter-public-smoke/index-v417.html
          PERSONAL=/tmp/stock-hunter-public-smoke/app-personal-v417.js
          PERSONAL_CSS=/tmp/stock-hunter-public-smoke/personal-v417.css
          PWA_MANIFEST=/tmp/stock-hunter-public-smoke/manifest.webmanifest
          CARRY=/tmp/stock-hunter-public-smoke/app-hunt-carry-v416.js

          grep -q 'hunt-runtime-core-v417.js' "$APP"
          grep -q 'app-runtime-router-v417.js' "$APP"
          grep -q 'shikar-sahm-v4.1.6-r16' "$SW"
          grep -q 'hunt-runtime-core-v417.js' "$SW"
          grep -q 'app-runtime-router-v417.js' "$SW"
          grep -q 'canary-recovery-v417.js' "$SW"
          grep -q 'app-hunt-carry-v416.js' "$SW"
          grep -q "sw.js?v=4.1.6-r16" "$APP_RUNTIME"
          grep -q "manifest.webmanifest?v=4.1.6-pwa-r15" "$APP"
          grep -q '"display":"standalone"' "$PWA_MANIFEST"
          grep -q '"theme_color":"#15181b"' "$PWA_MANIFEST"
          grep -q '"background_color":"#111315"' "$PWA_MANIFEST"
          grep -q '"scope":"./"' "$PWA_MANIFEST"
          grep -q "HUNT_CARRY_V416_VERSION='4.1.6-carry-v1'" "$CARRY"
          grep -q "const VERSION='4.1.7-runtime-core-v1';" "$CORE"
          grep -q "routingMode:'CHAMPION_ONLY'" "$ROUTER"
          grep -q 'trafficPercent:0' "$ROUTER"
          grep -q 'killSwitch:true' "$ROUTER"
          grep -q 'app-personal-v417.js?v=1' "$P417"
          grep -q 'personal-v417.css?v=1' "$P417"
          grep -q "auth-v417.html?next=index-v417.html" "$PERSONAL"
          grep -q "stock_hunter_user_preferences_v417" "$PERSONAL"
          grep -q "stock_hunter_watchlists_v417" "$PERSONAL"
          grep -q "notification_settings:{...(prefs.notification_settings||{}),sound:Boolean(sound)}" "$PERSONAL"
          if grep -A8 'const payload={' "$PERSONAL" | grep -q 'updated_at'; then
            echo "::error::personal preferences payload must not write protected updated_at"
            exit 1
          fi
          grep -q '.personal-star-v417.saved' "$PERSONAL_CSS"
          grep -q 'search-neutral-v416.css?v=1' "$APP"
          grep -q 'background:#131519' "$SEARCH_NEUTRAL"
          grep -q 'background:#191c21' "$SEARCH_NEUTRAL"
          if grep -q '#10243a' "$SEARCH_NEUTRAL"; then
            echo "::error::Published neutral search skin contains legacy blue active background"
            exit 1
          fi

      - name: Verify smoke remains read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/stock-hunter-public-production-smoke.yml').read_text(encoding='utf-8')
          curl_lines=[line.strip().lower() for line in w.splitlines() if 'curl ' in line.lower()]
          assert curl_lines, 'no curl lines found'
          for line in curl_lines:
              assert '-x post' not in line
              assert '-xpost' not in line
              assert '--request post' not in line
              assert '--data' not in line
              assert '--form' not in line
              assert '/functions/' not in line
              assert '/rpc/' not in line
          print('stock-hunter-public-production-smoke-readonly: PASS')
          PY

      - name: Final smoke result
        run: |
          echo 'stock-hunter-public-production-smoke: PASS'
