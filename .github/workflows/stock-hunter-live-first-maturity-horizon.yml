name: Stock Hunter Live First Maturity Horizon Check

on:
  push:
    branches: [main, 'stock-hunter-v417-*']
    paths:
      - '.github/workflows/stock-hunter-live-first-maturity-horizon.yml'
      - 'stock-hunter-v4/ci-live-check/stock-hunter-ci-live-check-v417/index.ts'
      - 'stock-hunter-v4/prospective-data/verify-first-maturity-horizon-v416.sql'
      - 'stock-hunter-v4/prospective-data/shadow-sample-quality-quarantine-v416.sql'
      - 'stock-hunter-v4/prospective-data/SHADOW_SAMPLE_QUALITY_QUARANTINE_AUDIT_2026-09-21.md'
      - 'stock-hunter-v4/prospective-data/LIVE_FIRST_MATURITY_GATE_AUDIT_2026-09-20.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stock-hunter-live-first-maturity-horizon.yml'
      - 'stock-hunter-v4/ci-live-check/stock-hunter-ci-live-check-v417/index.ts'
      - 'stock-hunter-v4/prospective-data/verify-first-maturity-horizon-v416.sql'
      - 'stock-hunter-v4/prospective-data/shadow-sample-quality-quarantine-v416.sql'
      - 'stock-hunter-v4/prospective-data/SHADOW_SAMPLE_QUALITY_QUARANTINE_AUDIT_2026-09-21.md'
      - 'stock-hunter-v4/prospective-data/LIVE_FIRST_MATURITY_GATE_AUDIT_2026-09-20.md'
  workflow_dispatch:
  schedule:
    - cron: '5 15 22 9 *'

permissions:
  contents: read
  id-token: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live maturity bridge contract
        run: |
          set -euo pipefail
          src=stock-hunter-v4/ci-live-check/stock-hunter-ci-live-check-v417/index.ts
          sql=stock-hunter-v4/prospective-data/verify-first-maturity-horizon-v416.sql
          grep -q 'SET TRANSACTION READ ONLY' "$src"
          grep -q 'first-maturity-horizon-v416' "$src"
          grep -q '2026-09-22T14:55:00.000Z' "$src"
          grep -q 'EXPECTED_MATURITY_WORKFLOW_REF="afzalpour/afzalpour.github.io/.github/workflows/stock-hunter-live-first-maturity-horizon.yml@refs/heads/main"' "$src"
          grep -q 'horizon_not_reached' "$src"
          grep -q "stock-hunter-first-maturity-horizon-v416: PASS" "$sql"
          grep -q "v_downstream_coverage<>15" "$sql"
          grep -q "stock_hunter_shadow_sample_exclusions_v416" "$sql"
          if grep -Ei 'SUPABASE_(DB_URL|SECRET|SERVICE_ROLE|ACCESS_TOKEN).*\$\{\{ *secrets\.' .github/workflows/stock-hunter-live-first-maturity-horizon.yml; then
            echo "::error::Live maturity workflow must not carry Supabase database/admin credentials"
            exit 1
          fi
          echo "stock-hunter-live-first-maturity-contract: PASS"

  live-maturity:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Enforce one-shot maturity deadline
        id: deadline
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          deadline="$(date -u -d '2026-09-22T14:55:00Z' +%s)"
          if [ "$now" -lt "$deadline" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "stock-hunter-first-maturity-horizon: NOT_ELIGIBLE_BEFORE_2026-09-22T14:55:00Z"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" != "2026-09-22" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "stock-hunter-first-maturity-horizon: HISTORICAL_SCHEDULE_SKIPPED"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token
        if: steps.deadline.outputs.eligible == 'true'
        env:
          AUDIENCE: stock-hunter-live-gate-v417
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")"
          token="$(printf '%s' "$response" | jq -r '.value')"
          test -n "$token"
          echo "::add-mask::$token"
          printf '%s' "$token" > "$RUNNER_TEMP/stock-hunter-oidc-token"

      - name: Execute canonical first maturity verifier through read-only bridge
        if: steps.deadline.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/stock-hunter-oidc-token")"
          body="$(mktemp)"
          code="$(curl --silent --show-error \
            -o "$body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"purpose":"first-maturity-horizon-v416"}' \
            "https://summnepwuziwulzvpcms.supabase.co/functions/v1/stock-hunter-ci-live-check-v417")"
          cat "$body"
          echo
          test "$code" = "200"
          jq -e '.result == "stock-hunter-first-maturity-horizon-v416: PASS"' "$body" >/dev/null
          echo "stock-hunter-live-first-maturity: PASS"
