name: Stock Hunter Cloud Raw Daily Pack

on:
  workflow_dispatch:
    inputs:
      tehran_date:
        description: 'Tehran market date YYYY-MM-DD (blank = today in Tehran)'
        required: false
        type: string
  schedule:
    - cron: '45 14 * * 0-3,6'

permissions:
  contents: read

concurrency:
  group: stock-hunter-cloud-raw-pack-${{ github.event.inputs.tehran_date || 'scheduled' }}
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    environment: stock-hunter-cloud-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: stock-hunter-market-v1
      STOCK_HUNTER_RAW_PACK_MAX_BYTES: '200000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Cloudflare read/write credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install pinned R2 tooling
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Resolve Tehran date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.tehran_date || '' }}
        run: |
          set -euo pipefail
          d="$INPUT_DATE"
          if [ -z "$d" ]; then d="$(TZ=Asia/Tehran date +%F)"; fi
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "value=$d" >> "$GITHUB_OUTPUT"

      - name: List raw objects with bounded Cloudflare REST API
        id: raw
        shell: bash
        run: |
          set -euo pipefail
          date="${{ steps.date.outputs.value }}"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/objects"
          curl -fsS -G "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --data-urlencode "prefix=raw/v1/$date/" --data-urlencode "per_page=1000" > raw-list.json
          jq -e '.success == true' raw-list.json >/dev/null
          count="$(jq '.result | length' raw-list.json)"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Download raw day
        if: steps.raw.outputs.count != '0'
        shell: bash
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/raw-day"
          jq -r '.result[].key' "$GITHUB_WORKSPACE/raw-list.json" | while read -r key; do
            [ -n "$key" ] || continue
            npx wrangler r2 object get "$BUCKET/$key" --file "$GITHUB_WORKSPACE/raw-day/$(basename "$key")" --remote >/dev/null
          done

      - name: Build deterministic raw pack
        if: steps.raw.outputs.count != '0'
        run: |
          node stock-hunter-v4/cloud-v1/historical/compact-r2-day-v1.mjs             --input raw-day --output pack-out --date "${{ steps.date.outputs.value }}"

      - name: Upload and verify pack
        if: steps.raw.outputs.count != '0'
        shell: bash
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
        run: |
          set -euo pipefail
          prefix="packs/raw-v1/${{ steps.date.outputs.value }}"
          npx wrangler r2 object put "$BUCKET/$prefix/market-facts.ndjson.gz" --file "$GITHUB_WORKSPACE/pack-out/market-facts.ndjson.gz" --remote >/dev/null
          npx wrangler r2 object put "$BUCKET/$prefix/manifest.json" --file "$GITHUB_WORKSPACE/pack-out/manifest.json" --remote >/dev/null
          npx wrangler r2 object get "$BUCKET/$prefix/manifest.json" --file "$RUNNER_TEMP/manifest-check.json" --remote >/dev/null
          cmp "$GITHUB_WORKSPACE/pack-out/manifest.json" "$RUNNER_TEMP/manifest-check.json"

      - name: No raw data notice
        if: steps.raw.outputs.count == '0'
        run: echo "No raw cloud snapshots for ${{ steps.date.outputs.value }}; no pack fabricated."
