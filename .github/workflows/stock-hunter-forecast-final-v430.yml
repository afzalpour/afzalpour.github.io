name: Stock Hunter Forecast Final v4.3.0

on:
  pull_request:
    paths:
      - 'stock-hunter-v4/forecast-final-v430/**'
      - '.github/workflows/stock-hunter-forecast-final-v430.yml'
      - 'stock-hunter-v4/CURRENT_HANDOFF.md'
  push:
    branches: [main]
    paths:
      - 'stock-hunter-v4/forecast-final-v430/**'
      - '.github/workflows/stock-hunter-forecast-final-v430.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast-final-v430:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-hunter-v4/forecast-final-v430
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Built-in self-test
        run: go run . --self-test
      - name: Cross-compile Windows x64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o Stock_Hunter_Forecast_Final_v4.3.0.exe .
      - name: Verify final evidence gate
        run: |
          grep -F '4.3.0-forecast-final-gated' main.go
          grep -F 'NO_STATISTICALLY_CONFIRMED_EDGE' main.go
          grep -F 'FinalForecastEnabled: false' main.go
          grep -F 'Frozen Hunt' README.md
      - name: Package
        run: |
          sha256sum Stock_Hunter_Forecast_Final_v4.3.0.exe > SHA256.txt
          zip -j Stock_Hunter_Forecast_Final_v4.3.0.zip             Stock_Hunter_Forecast_Final_v4.3.0.exe RUN_FINAL.cmd README.md SHA256.txt
          sha256sum Stock_Hunter_Forecast_Final_v4.3.0.zip >> SHA256.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stock_Hunter_Forecast_Final_v4.3.0
          path: |
            stock-hunter-v4/forecast-final-v430/Stock_Hunter_Forecast_Final_v4.3.0.exe
            stock-hunter-v4/forecast-final-v430/Stock_Hunter_Forecast_Final_v4.3.0.zip
            stock-hunter-v4/forecast-final-v430/SHA256.txt
          if-no-files-found: error
