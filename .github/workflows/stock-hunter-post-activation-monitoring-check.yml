name: Stock Hunter Post Activation Monitoring Contract
on:
  push:
    branches: [main, 'stock-hunter-v417-*']
    paths:
      - 'stock-hunter-v4/canary/post-activation-monitoring-hardening-v417.sql'
      - 'stock-hunter-v4/canary/post-activation-live-close-v417.sql'
      - 'stock-hunter-v4/canary/verify-post-activation-monitoring-v417.sql'
      - 'stock-hunter-v4/canary/verify-post-activation-live-close-v417.sql'
      - 'stock-hunter-v4/canary/POST_ACTIVATION_MONITORING_AUDIT_2026-09-18.md'
      - 'stock-hunter-v4/canary/POST_ACTIVATION_LIVE_CLOSE_AUDIT_2026-09-18.md'
      - '.github/workflows/stock-hunter-post-activation-monitoring-check.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify post-activation monitoring contract
        run: |
          python - <<'PY'
          from pathlib import Path

          base=Path('stock-hunter-v4/canary/post-activation-monitoring-hardening-v417.sql').read_text(encoding='utf-8')
          live=Path('stock-hunter-v4/canary/post-activation-live-close-v417.sql').read_text(encoding='utf-8')
          legacy=Path('stock-hunter-v4/canary/verify-post-activation-monitoring-v417.sql').read_text(encoding='utf-8')
          verify=Path('stock-hunter-v4/canary/verify-post-activation-live-close-v417.sql').read_text(encoding='utf-8')
          audit=Path('stock-hunter-v4/canary/POST_ACTIVATION_LIVE_CLOSE_AUDIT_2026-09-18.md').read_text(encoding='utf-8')

          for token in [
            'min_stability_trade_dates=5',
            'min_pairs_per_mode=500',
            'min_symbols_per_mode=75',
            'min_buckets_per_mode=8',
            'max_telemetry_age_minutes=15',
            "required_recommendation='PASS'",
            'auto_rollback=false',
            'auto_finalize=false',
            'stock_hunter_post_activation_policy_immutable_v417',
          ]:
            assert token in base, token

          for token in [
            "when q.recommendation='STABLE' then 'PASS'",
            'min_mode_last_observed_at',
            'min_recommendation_observed_at',
            'POST_ACTIVATION_ROUTED_EVIDENCE_STALE',
            'POST_ACTIVATION_RECOMMENDATION_EVIDENCE_STALE',
            "s.champion_engine_version='4.1.6-hunt-v2'",
            'READY_FOR_MANUAL_VERSION_PROMOTION_REVIEW',
            'with (security_invoker=true)',
          ]:
            assert token in live, token

          for token in [
            'post-activation monitor output contract drifted',
            'healthy STABLE telemetry is not normalized to post-activation PASS',
            'post-activation two-mode evidence freshness contract is incomplete',
            'manual post-activation rollback path does not restore Champion-only safe routing',
            'release-pin consumer is not bound to post-activation stability',
            'stock-hunter-post-activation-live-close-v417: PASS',
          ]:
            assert token in verify, token

          assert 'stock-hunter-post-activation-monitoring-v417: PASS' in legacy
          assert 'min_mode_last_observed_at' in legacy
          assert 'min_recommendation_observed_at' in legacy

          assert 'LIVE_CONTRACT_PASS / REAL_POST_ACTIVATION_STABILITY_NOT_STARTED' in audit
          assert '20260918124656' in audit
          assert 'STABLE -> PASS' in audit
          assert 'Roadmap item #13 is live-closed structurally' in audit

          print('stock-hunter-post-activation-monitoring-contract: PASS')
          PY
