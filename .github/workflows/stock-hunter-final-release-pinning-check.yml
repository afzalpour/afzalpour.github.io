name: Stock Hunter Final Release Pinning Contract
on:
  push:
    branches: [main, 'stock-hunter-v417-*']
    paths:
      - 'stock-hunter-v4/release/final-release-pinning-hardening-v417.sql'
      - 'stock-hunter-v4/release/final-release-live-close-v417.sql'
      - 'stock-hunter-v4/release/verify-final-release-pinning-v417.sql'
      - 'stock-hunter-v4/release/verify-final-release-live-close-v417.sql'
      - 'stock-hunter-v4/release/FINAL_RELEASE_PINNING_AUDIT_2026-09-18.md'
      - 'stock-hunter-v4/release/FINAL_RELEASE_LIVE_CLOSE_AUDIT_2026-09-18.md'
      - 'stock-hunter-v4/release/rollback-v416/**'
      - 'stock-hunter-v4/app-hunt-v416.js'
      - 'stock-hunter-v4/index.html'
      - 'stock-hunter-v4/sw.js'
      - '.github/workflows/stock-hunter-final-release-pinning-check.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify final release and rollback package contract
        run: |
          python - <<'PY'
          from pathlib import Path

          base=Path('stock-hunter-v4/release/final-release-pinning-hardening-v417.sql').read_text(encoding='utf-8')
          live=Path('stock-hunter-v4/release/final-release-live-close-v417.sql').read_text(encoding='utf-8')
          legacy=Path('stock-hunter-v4/release/verify-final-release-pinning-v417.sql').read_text(encoding='utf-8')
          verify=Path('stock-hunter-v4/release/verify-final-release-live-close-v417.sql').read_text(encoding='utf-8')
          audit=Path('stock-hunter-v4/release/FINAL_RELEASE_LIVE_CLOSE_AUDIT_2026-09-18.md').read_text(encoding='utf-8')
          rb=Path('stock-hunter-v4/release/rollback-v416/ROLLBACK_PACKAGE_V416_2026-09-18.md').read_text(encoding='utf-8')
          edge=Path('stock-hunter-v4/release/rollback-v416/stock-hunter-capture-v416/index.ts').read_text(encoding='utf-8')
          hunt=Path('stock-hunter-v4/app-hunt-v416.js').read_text(encoding='utf-8')
          index=Path('stock-hunter-v4/index.html').read_text(encoding='utf-8')
          sw=Path('stock-hunter-v4/sw.js').read_text(encoding='utf-8')

          for token in [
            "target_release_version='4.1.7'",
            "previous_stable_version='4.1.6'",
            "required_capture_function_slug='stock-hunter-capture-v417'",
            'capture_deployment_sha256',
            'stock_hunter_release_pin_policy_immutable_v417',
            'stock_hunter_release_manifest_immutable_v417',
            'stock_hunter_release_freeze_authorization_immutable_v417',
            'stock_hunter_previous_stable_archive_immutable_v417',
            'authorize_stock_hunter_release_freeze_v417',
            'freeze_stock_hunter_release_v417',
            'release manifest fingerprint mismatch',
            'runtime_state_changed',
          ]:
            assert token in base, token

          for token in [
            'max_component_attestation_age_minutes=60',
            'stock_hunter_release_component_attestations_v417',
            'GITHUB_API+SUPABASE_MANAGEMENT_API',
            'record_stock_hunter_release_component_attestation_v417',
            'fresh externally verified 4.1.7 component attestation is required',
            'component_attestation_id',
            'RELEASE_COMPONENT_ATTESTATION_MISSING',
            'RELEASE_COMPONENT_ATTESTATION_MISMATCH',
            'RELEASE_COMPONENT_ATTESTATION_STALE',
            'pass_component_attestation',
          ]:
            assert token in live, token

          assert 'stock-hunter-final-release-pinning-v417: PASS' in legacy

          for token in [
            'external component attestation evidence contract mismatch',
            'release manifest is not bound to an immutable component attestation',
            'release-pin readiness is not externally attestation-bound',
            'release PREPARE is not bound to fresh external component evidence',
            'final freeze attestation/rollback contract mismatch',
            'stock-hunter-final-release-live-close-v417: PASS',
          ]:
            assert token in verify, token

          assert 'LIVE_CONTRACT_PASS / REAL_FINAL_RELEASE_BLOCKED_ON_MATURITY_AND_FRESH_ATTESTATION' in audit
          assert '20260918131512' in audit
          assert 'stock-hunter-capture-v417' in audit
          assert '066cc265d990a9673aff0d755acebe142a89170e0479616ea2fc76fe4974a543' in audit
          assert 'Roadmap item #14 is structurally live-closed.' in audit

          assert 'b550ac2dddf297d2436493f4e7384a166dbdf1dd' in rb
          assert 'shikar-sahm-v4.1.6-r12' in rb
          assert 'stock-hunter-capture-v416' in rb
          assert '49f8a9a666b60801b670f4784404293bb3e0bbfee8b70d07a36a7d992fa31740' in rb

          assert "HUNT_V416_VERSION='4.1.6-hunt-v2'" in hunt
          assert '۴.۱.۶' in index
          assert "const CACHE='shikar-sahm-v4.1.6-r12'" in sw
          assert 'stock_hunter_validate_capture_request_v416' in edge
          assert "authMode!=='hmac-sha256-v2'" in edge
          assert 'stock_hunter_validate_capture_token_v416' not in edge
          assert "source_version:'4.1.6-server-v4-parity'" in edge
          assert "Date.now()-180000" in edge
          assert ".gte('updated_at',freshCutoffIso)" in edge

          # The rollback tree must not be silently replaced by a final-v417 capture source.
          assert not Path('stock-hunter-v4/release/rollback-v416/stock-hunter-capture-v417').exists()

          print('stock-hunter-final-release-live-close-contract: PASS')
          PY
