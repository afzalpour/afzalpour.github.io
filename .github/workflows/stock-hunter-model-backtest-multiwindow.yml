name: Stock Hunter Multi-Window Model Backtest
on:
  push:
    branches: [main]
    paths:
      - 'stock-hunter-v4/research/backtest_5models_v415.py'
      - 'stock-hunter-v4/research/backtest_5models_fast.py'
      - 'stock-hunter-v4/research/backtest_5models_multiwindow.py'
      - '.github/workflows/stock-hunter-model-backtest-multiwindow.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run 60-case multi-window backtest
        run: python stock-hunter-v4/research/backtest_5models_multiwindow.py
