name: Stock Hunter Capture v417 Dark Deploy Contract
on:
  push:
    branches: [main, 'stock-hunter-v417-*']
    paths:
      - 'stock-hunter-v4/release/capture-v417/stock-hunter-capture-v417/index.ts'
      - 'stock-hunter-v4/release/rollback-v416/stock-hunter-capture-v416/index.ts'
      - 'stock-hunter-v4/release/CAPTURE_V417_DARK_DEPLOY_AUDIT_2026-09-18.md'
      - 'stock-hunter-v4/release/FINAL_RELEASE_LIVE_CLOSE_AUDIT_2026-09-18.md'
      - '.github/workflows/stock-hunter-capture-v417-dark-deploy-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'stock-hunter-v4/release/capture-v417/stock-hunter-capture-v417/index.ts'
      - 'stock-hunter-v4/release/rollback-v416/stock-hunter-capture-v416/index.ts'
      - 'stock-hunter-v4/release/CAPTURE_V417_DARK_DEPLOY_AUDIT_2026-09-18.md'
      - 'stock-hunter-v4/release/FINAL_RELEASE_LIVE_CLOSE_AUDIT_2026-09-18.md'
      - '.github/workflows/stock-hunter-capture-v417-dark-deploy-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved v417 identity and HMAC-security derivation
        run: |
          python - <<'PY'
          from pathlib import Path

          base=Path('stock-hunter-v4/release/rollback-v416/stock-hunter-capture-v416/index.ts').read_text(encoding='utf-8')
          actual=Path('stock-hunter-v4/release/capture-v417/stock-hunter-capture-v417/index.ts').read_text(encoding='utf-8')
          audit=Path('stock-hunter-v4/release/CAPTURE_V417_DARK_DEPLOY_AUDIT_2026-09-18.md').read_text(encoding='utf-8')
          final_audit=Path('stock-hunter-v4/release/FINAL_RELEASE_LIVE_CLOSE_AUDIT_2026-09-18.md').read_text(encoding='utf-8')

          expected=base
          expected=expected.replace("'4.1.6-shadow-v2-parity'","'4.1.7-shadow-capture-v1-parity'")
          expected=expected.replace("'4.1.6-server-v4-parity'","'4.1.7-server-v1-parity'")
          expected=expected.replace("'4.1.6-browser-server-parity-v1'","'4.1.7-capture-parity-v1'")
          expected=expected.replace(
              "return{protocol:'4.1.7-capture-parity-v1',fixedNow:PARITY_FIXED_ISO,results:",
              "return{protocol:'4.1.7-capture-parity-v1',componentVersion:'4.1.7',storageProtocol:'v416-stable-schema',fixedNow:PARITY_FIXED_ISO,results:"
          )
          expected=expected.replace(
              "return Response.json({ok:true,scanned:(data||[]).length,candidates:events.length,recorded,shadow_candidates:shadows.length,shadow_recorded:shadowRecorded,trade_date:now.ymd,source_version:'4.1.7-server-v1-parity'});",
              "return Response.json({ok:true,component_version:'4.1.7',storage_protocol:'v416-stable-schema',scanned:(data||[]).length,candidates:events.length,recorded,shadow_candidates:shadows.length,shadow_recorded:shadowRecorded,trade_date:now.ymd,source_version:'4.1.7-server-v1-parity'});"
          )

          helper="""function captureAdminKey(){
            const legacy=Deno.env.get('SUPABASE_SERVICE_ROLE_KEY');
            if(legacy)return legacy;
            const raw=Deno.env.get('SUPABASE_SECRET_KEYS');
            if(!raw)throw new Error('capture admin key unavailable');
            const parsed=JSON.parse(raw);
            if(!parsed?.default)throw new Error('default capture admin key unavailable');
            return parsed.default;
          }

          """
          serve="Deno.serve(async(req)=>{"
          assert serve in expected
          expected=expected.replace(serve,helper+serve,1)

          old_auth="""  const url=Deno.env.get('SUPABASE_URL')!,key=Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')!;
            const sb=createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false}});
            const captureToken=req.headers.get('x-stock-hunter-capture-token')||'';
            if(!captureToken)return Response.json({ok:false,error:'unauthorized'},{status:401});
            const{data:authorized,error:authErr}=await sb.rpc('stock_hunter_validate_capture_token_v416',{p_token:captureToken});
            if(authErr||authorized!==true)return Response.json({ok:false,error:'unauthorized'},{status:401});
          """
          new_auth="""  const url=Deno.env.get('SUPABASE_URL')!,key=captureAdminKey();
            const sb=createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false}});
            if(req.headers.has('x-stock-hunter-capture-token')){
              return Response.json({ok:false,error:'unauthorized'},{status:401,headers:{'Cache-Control':'no-store'}});
            }
            const authMode=req.headers.get('x-stock-hunter-capture-auth')||'';
            const timestampRaw=req.headers.get('x-stock-hunter-capture-timestamp')||'';
            const nonce=req.headers.get('x-stock-hunter-capture-nonce')||'';
            const signature=req.headers.get('x-stock-hunter-capture-signature')||'';
            if(authMode!=='hmac-sha256-v2'||!/^[0-9]{10,12}$/.test(timestampRaw)||nonce.length>64||!/^[0-9a-f]{64}$/.test(signature)){
              return Response.json({ok:false,error:'unauthorized'},{status:401,headers:{'Cache-Control':'no-store'}});
            }
            const timestamp=Number(timestampRaw);
            if(!Number.isSafeInteger(timestamp)){
              return Response.json({ok:false,error:'unauthorized'},{status:401,headers:{'Cache-Control':'no-store'}});
            }
            const{data:authorized,error:authErr}=await sb.rpc('stock_hunter_validate_capture_request_v416',{
              p_timestamp:timestamp,p_nonce:nonce,p_signature:signature
            });
            if(authErr||authorized!==true){
              return Response.json({ok:false,error:'unauthorized'},{status:401,headers:{'Cache-Control':'no-store'}});
            }
          """
          assert old_auth in expected, 'archived v416 auth block changed unexpectedly'
          expected=expected.replace(old_auth,new_auth,1)

          assert actual == expected, 'capture-v417 contains changes beyond approved identity/version + HMAC-security delta'

          for token in [
              'npm:@supabase/supabase-js@2.116.0',
              'x-stock-hunter-capture-token',
              'x-stock-hunter-capture-auth',
              'x-stock-hunter-capture-timestamp',
              'x-stock-hunter-capture-nonce',
              'x-stock-hunter-capture-signature',
              'hmac-sha256-v2',
              'stock_hunter_validate_capture_request_v416',
              'claim_stock_hunter_capture_v416',
              'record_stock_hunter_hunt_events_v416',
              'record_stock_hunter_shadow_samples_v416',
              'finish_stock_hunter_capture_v416',
              "protocol:'4.1.7-capture-parity-v1'",
              "componentVersion:'4.1.7'",
              "storageProtocol:'v416-stable-schema'",
              "source_version:'4.1.7-server-v1-parity'",
              'SUPABASE_SECRET_KEYS',
          ]:
              assert token in actual, token

          assert 'stock_hunter_validate_capture_token_v416' not in actual
          assert 'const captureToken=' not in actual
          assert "req.headers.has('x-stock-hunter-capture-token')" in actual

          assert 'DARK_DEPLOYED / NO_TRAFFIC / NO_FINAL_ATTESTATION' in audit
          assert 'HMAC_HARDENED' in audit
          assert 'DEPLOYMENT_VERSION: 2' in audit
          assert '066cc265d990a9673aff0d755acebe142a89170e0479616ea2fc76fe4974a543' in audit
          assert 'LIVE_CONTRACT_PASS / REAL_FINAL_RELEASE_BLOCKED_ON_MATURITY_AND_FRESH_ATTESTATION' in final_audit

          print('stock-hunter-capture-v417-dark-deploy-contract: PASS')
          PY
