name: Stock Hunter Integrated Provenance Recovery v1

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only provenance recovery contract
        run: |
          set -euo pipefail
          src=stock-hunter-v4/ci-live-check/stock-hunter-ci-live-check-v417/index.ts
          grep -q 'integrated-provenance-v410' "$src"
          grep -q 'EXPECTED_PROVENANCE_WORKFLOW_REF="afzalpour/afzalpour.github.io/.github/workflows/stock-hunter-integrated-provenance-recovery-v1.yml@refs/heads/main"' "$src"
          grep -q 'SET TRANSACTION READ ONLY' "$src"
          grep -q "pg_get_viewdef" "$src"
          grep -q "pg_get_functiondef" "$src"
          if grep -Ei 'SUPABASE_(DB_URL|SECRET|SERVICE_ROLE|ACCESS_TOKEN).*${{ *secrets.' .github/workflows/stock-hunter-integrated-provenance-recovery-v1.yml; then
            echo "::error::Provenance workflow must not carry Supabase database/admin credentials"
            exit 1
          fi
          echo "stock-hunter-integrated-provenance-contract: PASS"

  recover:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Request GitHub OIDC token
        env:
          AUDIENCE: stock-hunter-live-gate-v417
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")"
          token="$(printf '%s' "$response" | jq -r '.value')"
          test -n "$token"
          echo "::add-mask::$token"
          printf '%s' "$token" > "$RUNNER_TEMP/stock-hunter-oidc-token"

      - name: Recover integrated view provenance through read-only bridge
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/stock-hunter-oidc-token")"
          body="$RUNNER_TEMP/integrated-provenance-response.json"
          code="$(curl --silent --show-error             -o "$body" -w '%{http_code}'             -X POST             -H "Authorization: Bearer $token"             -H "Content-Type: application/json"             --data '{"purpose":"integrated-provenance-v410"}'             "https://summnepwuziwulzvpcms.supabase.co/functions/v1/stock-hunter-ci-live-check-v417")"
          cat "$body"
          echo
          test "$code" = "200"
          jq -e '.result == "stock-hunter-integrated-provenance-v410: PASS"' "$body" >/dev/null
          jq -e '.verifier_output.view == "public.stock_hunter_integrated_v1"' "$body" >/dev/null
          jq '.verifier_output' "$body" > "$RUNNER_TEMP/stock-hunter-integrated-provenance-v410.json"
          echo "stock-hunter-integrated-provenance-recovery: PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: stock-hunter-integrated-provenance-v410
          path: ${{ runner.temp }}/stock-hunter-integrated-provenance-v410.json
          if-no-files-found: error
          retention-days: 30
