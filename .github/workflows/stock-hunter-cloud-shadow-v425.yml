name: Stock Hunter Cloud Live Shadow v4.2.5

on:
  workflow_dispatch:
    inputs:
      tehran_date:
        description: 'Tehran market date YYYY-MM-DD (blank = today in Tehran)'
        required: false
        type: string
  schedule:
    - cron: '20 15 * * 0-3,6'
  push:
    branches: [main]
    paths:
      - 'stock-hunter-v4/cloud-v1/historical/shadow-replay-v425.ts'
      - '.github/workflows/stock-hunter-cloud-shadow-v425.yml'

permissions:
  contents: read

concurrency:
  group: stock-hunter-cloud-shadow-v425-${{ github.event.inputs.tehran_date || 'scheduled' }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned replay tooling
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Shadow replay self-test
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
        run: ./node_modules/.bin/tsx ../historical/shadow-replay-v425.ts --self-test
      - name: Frozen Champion remains pinned
        run: |
          grep -F "HUNT_V416_VERSION='4.1.6-hunt-v2'" stock-hunter-v4/app-hunt-v416.js
          grep -F "4.2.5-challenger-shadow-v1" stock-hunter-v4/app-hunt-challenger-v425.js

  shadow:
    needs: contract
    runs-on: ubuntu-latest
    environment: stock-hunter-cloud-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: stock-hunter-market-v1
      STOCK_HUNTER_RAW_PACK_MAX_BYTES: '200000000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect bounded Cloudflare credentials
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloud Shadow v4.2.5 is credential-blocked: CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are not configured in stock-hunter-cloud-production."
          fi

      - name: Install pinned replay and R2 tooling
        if: steps.creds.outputs.ready == '1'
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Resolve Tehran date
        if: steps.creds.outputs.ready == '1'
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.tehran_date || '' }}
        run: |
          set -euo pipefail
          d="$INPUT_DATE"
          if [ -z "$d" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            d="$(TZ=Asia/Tehran date -d 'yesterday' +%F)"
          fi
          if [ -z "$d" ]; then d="$(TZ=Asia/Tehran date +%F)"; fi
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "value=$d" >> "$GITHUB_OUTPUT"

      - name: Locate target market pack or raw snapshots
        if: steps.creds.outputs.ready == '1'
        id: source
        shell: bash
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
        run: |
          set -euo pipefail
          date="${{ steps.date.outputs.value }}"
          mkdir -p "$GITHUB_WORKSPACE/shadow-input" "$GITHUB_WORKSPACE/raw-day"
          if npx wrangler r2 object get "$BUCKET/packs/raw-v1/$date/market-facts.ndjson.gz" --file "$GITHUB_WORKSPACE/shadow-input/market-facts.ndjson.gz" --remote >/dev/null 2>&1; then
            echo "pack=1" >> "$GITHUB_OUTPUT"
            echo "raw=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/objects"
          curl -fsS -G "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --data-urlencode "prefix=raw/v1/$date/" --data-urlencode "per_page=1000" > "$GITHUB_WORKSPACE/raw-list.json"
          jq -e '.success == true' "$GITHUB_WORKSPACE/raw-list.json" >/dev/null
          count="$(jq '[.result[] | select(.key | startswith("raw/v1/'"$date"'/"))] | length' "$GITHUB_WORKSPACE/raw-list.json")"
          echo "pack=0" >> "$GITHUB_OUTPUT"
          echo "raw=$count" >> "$GITHUB_OUTPUT"

      - name: Build target pack from prospective raw snapshots
        if: steps.creds.outputs.ready == '1' && steps.source.outputs.pack != '1' && steps.source.outputs.raw != '0'
        shell: bash
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
        run: |
          set -euo pipefail
          jq -r '.result[].key' "$GITHUB_WORKSPACE/raw-list.json" | while read -r key; do
            [ -n "$key" ] || continue
            name="$(basename "$key")"
            npx wrangler r2 object get "$BUCKET/$key" --file "$GITHUB_WORKSPACE/raw-day/$name" --remote >/dev/null
          done
          node ../historical/compact-r2-day-v1.mjs --input "$GITHUB_WORKSPACE/raw-day" --output "$GITHUB_WORKSPACE/local-pack" --date "${{ steps.date.outputs.value }}"
          cp "$GITHUB_WORKSPACE/local-pack/market-facts.ndjson.gz" "$GITHUB_WORKSPACE/shadow-input/market-facts.ndjson.gz"

      - name: Download bounded prior-session RVOL baseline
        if: steps.creds.outputs.ready == '1' && (steps.source.outputs.pack == '1' || steps.source.outputs.raw != '0')
        shell: bash
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
        run: |
          set -euo pipefail
          target="${{ steps.date.outputs.value }}"
          mkdir -p "$GITHUB_WORKSPACE/baseline-input"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/objects"
          curl -fsS -G "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --data-urlencode "prefix=packs/raw-v1/" --data-urlencode "per_page=1000" > "$GITHUB_WORKSPACE/pack-list.json"
          jq -e '.success == true' "$GITHUB_WORKSPACE/pack-list.json" >/dev/null
          jq -r '.result[].key' "$GITHUB_WORKSPACE/pack-list.json" |
            grep -E '^packs/raw-v1/[0-9]{4}-[0-9]{2}-[0-9]{2}/market-facts\.ndjson\.gz$' |
            sed -E 's#^packs/raw-v1/([0-9]{4}-[0-9]{2}-[0-9]{2})/market-facts\.ndjson\.gz$#\1#' |
            awk -v t="$target" '$1 < t' | sort -u | tail -n 20 > "$GITHUB_WORKSPACE/baseline-dates.txt" || true
          while read -r d; do
            [ -n "$d" ] || continue
            npx wrangler r2 object get "$BUCKET/packs/raw-v1/$d/market-facts.ndjson.gz" --file "$GITHUB_WORKSPACE/baseline-input/$d.ndjson.gz" --remote >/dev/null
          done < "$GITHUB_WORKSPACE/baseline-dates.txt"
          echo "baseline_days=$(find "$GITHUB_WORKSPACE/baseline-input" -type f -name '*.gz' | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Replay Champion and Challenger on identical prospective snapshots
        if: steps.creds.outputs.ready == '1' && (steps.source.outputs.pack == '1' || steps.source.outputs.raw != '0')
        shell: bash
        run: |
          set -euo pipefail
          ./stock-hunter-v4/cloud-v1/cloudflare/node_modules/.bin/tsx stock-hunter-v4/cloud-v1/historical/shadow-replay-v425.ts             --input shadow-input/market-facts.ndjson.gz             --baseline-dir baseline-input             --output shadow-out/shadow-v425-report.json             --date "${{ steps.date.outputs.value }}"

      - name: Persist bounded 4.2.5 Shadow report
        if: steps.creds.outputs.ready == '1' && (steps.source.outputs.pack == '1' || steps.source.outputs.raw != '0')
        shell: bash
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
        run: |
          set -euo pipefail
          key="packs/raw-v1/${{ steps.date.outputs.value }}/shadow-v425-report.json"
          npx wrangler r2 object put "$BUCKET/$key" --file "$GITHUB_WORKSPACE/shadow-out/shadow-v425-report.json" --remote >/dev/null
          test -s "$GITHUB_WORKSPACE/shadow-out/shadow-v425-report.json"

      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.ready == '1' && (steps.source.outputs.pack == '1' || steps.source.outputs.raw != '0')
        with:
          name: stock-hunter-shadow-v425-${{ steps.date.outputs.value }}
          path: shadow-out/shadow-v425-report.json
          retention-days: 30
          if-no-files-found: error

      - name: No prospective data notice
        if: steps.creds.outputs.ready == '1' && steps.source.outputs.pack != '1' && steps.source.outputs.raw == '0'
        run: echo "No prospective cloud snapshots for ${{ steps.date.outputs.value }}; no Challenger evidence fabricated."

      - name: Cloud credential blocker notice
        if: steps.creds.outputs.ready != '1'
        run: echo "Shadow replay code/self-test passed, but cloud object access is disabled until the Cloudflare credentials are configured; no evidence is fabricated."
