name: Stock Hunter TSETMC Probe
on:
  push:
    branches: [main]
    paths:
      - 'stock-hunter-v4/probe_tsetmc.py'
      - '.github/workflows/stock-hunter-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe TSETMC
        run: python stock-hunter-v4/probe_tsetmc.py
