name: Stock Hunter v4 Worker
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run diagnostic scanner manually
        run: python stock-hunter-v4/worker.py
