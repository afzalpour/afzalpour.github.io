name: Stock Hunter Auth URL Config Fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/stock-hunter-auth-url-config-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-auth-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Require Supabase management token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 2
          fi

      - name: Update Auth Site URL and redirect allow-list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: summnepwuziwulzvpcms
          SITE_URL: https://afzalpour.github.io/stock-hunter-v4/
          AUTH_URL: https://afzalpour.github.io/stock-hunter-v4/auth-v417.html
          WILDCARD_URL: https://afzalpour.github.io/stock-hunter-v4/**
        run: |
          set -euo pipefail
          cfg="$(mktemp)"
          payload="$(mktemp)"
          verify="$(mktemp)"
          trap 'rm -f "$cfg" "$payload" "$verify"' EXIT

          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             -o "$cfg"

          current="$(jq -r '.uri_allow_list // ""' "$cfg")"
          python3 - "$current" "$AUTH_URL" "$WILDCARD_URL" > /tmp/stock_hunter_redirects.txt <<'PY'
import sys
parts=[]
for chunk in sys.argv[1:]:
    for item in chunk.split(","):
        item=item.strip()
        if item and item not in parts:
            parts.append(item)
print(",".join(parts))
PY
          allow_list="$(cat /tmp/stock_hunter_redirects.txt)"

          jq -n             --arg site "$SITE_URL"             --arg allow "$allow_list"             '{site_url:$site, uri_allow_list:$allow}' > "$payload"

          curl --fail-with-body --silent --show-error             -X PATCH             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary @"$payload"             "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             >/dev/null

          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             -o "$verify"

          test "$(jq -r '.site_url' "$verify")" = "$SITE_URL"
          jq -r '.uri_allow_list // ""' "$verify" | grep -F "$AUTH_URL" >/dev/null
          jq -r '.uri_allow_list // ""' "$verify" | grep -F "$WILDCARD_URL" >/dev/null

          echo "Auth URL configuration verified."
