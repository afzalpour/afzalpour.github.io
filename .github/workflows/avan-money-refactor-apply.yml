name: Avan Money Refactor Cleanup Gate

on:
  push:
    branches:
      - rc1.5-money-architecture-refactor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1.5-money-architecture-refactor
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Final architecture quality gate
        working-directory: avan-staging
        run: npm run quality
