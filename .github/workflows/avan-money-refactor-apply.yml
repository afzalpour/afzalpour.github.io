name: Avan Money Refactor Apply

on:
  push:
    branches:
      - rc1.5-money-architecture-refactor
    paths:
      - 'avan-staging/scripts/apply-money-architecture-refactor.mjs'
      - 'avan-staging/scripts/apply-money-architecture-phase2.mjs'
      - '.github/workflows/avan-money-refactor-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1.5-money-architecture-refactor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harden phase 1 regex cardinality helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('avan-staging/scripts/apply-money-architecture-refactor.mjs')
          s=p.read_text()
          old="""function replaceRegexOnce(source, re, after, label) {
            const matches = source.match(re);
            if (!matches || matches.length !== 1) throw new Error(`${label}: expected exactly one match`);
            return source.replace(re, after);
          }"""
          new="""function replaceRegexOnce(source, re, after, label) {
            const flags = re.flags.includes('g') ? re.flags : `${re.flags}g`;
            const matches = [...source.matchAll(new RegExp(re.source, flags))];
            if (matches.length !== 1) throw new Error(`${label}: expected exactly one match, found ${matches.length}`);
            return source.replace(re, after);
          }"""
          if old in s:
              p.write_text(s.replace(old,new))
          PY
      - name: Apply money refactor migrations
        run: |
          node avan-staging/scripts/apply-money-architecture-refactor.mjs
          node avan-staging/scripts/apply-money-architecture-phase2.mjs
      - name: Syntax check transformed runtime
        run: |
          node --check avan-staging/app.js
          node --check avan-staging/rc14-catalog-settlement-v61.js
          node --check avan-staging/rc14-inventory-operations.js
          node --check avan-staging/rc13-final-polish.js
          node --check avan-staging/rc15-tax-ux-v3.js
          node --check avan-staging/src/ui/settlement/settlement-workspace-v2.js
          node --check avan-staging/src/ui/tax/tax-workspace-v2.js
          node --check avan-staging/src/ui/money/money-runtime.js
      - name: Commit transformed sources
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add avan-staging/app.js avan-staging/rc14-catalog-settlement-v61.js avan-staging/rc14-inventory-operations.js avan-staging/rc13-final-polish.js avan-staging/rc15-tax-ux-v3.js avan-staging/src/ui/settlement/settlement-workspace-v2.js avan-staging/index.html avan-staging/sw.js
          git commit -m 'Activate unified money runtime across Web and PWA'
          git push origin HEAD:rc1.5-money-architecture-refactor
