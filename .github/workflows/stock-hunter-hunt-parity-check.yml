name: Stock Hunter 4.1.6 Browser Server Parity Check
on:
  push:
    branches: [main, 'stock-hunter-v416-*', 'stock-hunter-v417-*']
    paths:
      - 'stock-hunter-v4/app-session-v413.js'
      - 'stock-hunter-v4/app-hunt-v416.js'
      - 'stock-hunter-v4/hunt-parity-v416.js'
      - 'stock-hunter-v4/parity/**'
      - 'stock-hunter-v4/capture-security/**'
      - '.github/workflows/stock-hunter-hunt-parity-check.yml'
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check parity JavaScript
        run: |
          node --check stock-hunter-v4/app-session-v413.js
          node --check stock-hunter-v4/app-hunt-v416.js
          node --check stock-hunter-v4/hunt-parity-v416.js
      - name: Run browser parity fixtures
        run: node stock-hunter-v4/hunt-parity-v416.js
      - name: Compare browser fixtures with deployed capture backend
        env:
          PARITY_URL: https://summnepwuziwulzvpcms.supabase.co/functions/v1/stock-hunter-capture-v416?parity=1
        run: |
          node stock-hunter-v4/hunt-parity-v416.js --json > /tmp/browser-parity.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$PARITY_URL" > /tmp/server-parity.json
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const browser=JSON.parse(fs.readFileSync('/tmp/browser-parity.json','utf8'));
          const server=JSON.parse(fs.readFileSync('/tmp/server-parity.json','utf8'));
          assert.strictEqual(browser.protocol,'4.1.6-browser-server-parity-v1');
          assert.strictEqual(browser.results.length,9);
          assert.deepStrictEqual(server,browser);
          console.log(`browser-server-parity: PASS (${browser.results.length} frozen fixtures)`);
          NODE
      - name: Verify capture endpoint rejects public and confused callers
        env:
          CAPTURE_URL: https://summnepwuziwulzvpcms.supabase.co/functions/v1/stock-hunter-capture-v416
        run: |
          assert_json_status() {
            expected="$1"; expected_error="$2"; outfile="$3"; shift 3
            actual=$(curl --silent --show-error --output "$outfile" --write-out '%{http_code}' "$@")
            test "$actual" = "$expected"
            grep -q "\"$expected_error\"" "$outfile"
          }

          # No custom capture secret: never reaches claim/scan.
          assert_json_status 401 unauthorized /tmp/capture-unauth.json \
            -X POST -H 'Content-Type: application/json' --data '{}' "$CAPTURE_URL"

          # A forged capture token must fail closed.
          assert_json_status 401 unauthorized /tmp/capture-wrong.json \
            -X POST -H 'Content-Type: application/json' \
            -H 'X-Stock-Hunter-Capture-Token: definitely-wrong-token' \
            --data '{}' "$CAPTURE_URL"

          # Supabase/JWT-looking credentials do not substitute for the dedicated capture secret.
          assert_json_status 401 unauthorized /tmp/capture-bearer-only.json \
            -X POST -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer definitely-not-a-capture-token' \
            --data '{}' "$CAPTURE_URL"

          # Base endpoint is POST-only; a public GET cannot trigger capture.
          assert_json_status 405 method-not-allowed /tmp/capture-get.json \
            -X GET "$CAPTURE_URL"

          # Parity is GET-only; POST + parity cannot bypass capture auth.
          assert_json_status 405 method-not-allowed /tmp/capture-parity-post.json \
            -X POST -H 'Content-Type: application/json' --data '{}' "$CAPTURE_URL?parity=1"

          echo 'capture-auth-regression: PASS (secret + method boundary)'
      - name: Verify capture security contract is versioned
        run: |
          grep -q 'CAPTURE_AUTH_CONTRACT: VAULT_SECRET_SERVICE_ROLE_ONLY' stock-hunter-v4/capture-security/CAPTURE_AUTH_V416.md
          grep -q "vault.decrypted_secrets" stock-hunter-v4/capture-security/capture-auth-v416.sql
          grep -q "REVOKE ALL ON FUNCTION public.stock_hunter_validate_capture_token_v416(text) FROM PUBLIC, anon, authenticated" stock-hunter-v4/capture-security/capture-auth-v416.sql
          grep -q "GRANT EXECUTE ON FUNCTION public.stock_hunter_validate_capture_token_v416(text) TO service_role" stock-hunter-v4/capture-security/capture-auth-v416.sql
          grep -q "search_path TO ''" stock-hunter-v4/capture-security/capture-auth-v416.sql
      - name: Verify production Hunt contract unchanged
        run: |
          grep -q "HUNT_V416_VERSION='4.1.6-hunt-v2'" stock-hunter-v4/app-hunt-v416.js
          grep -q "dayChange<0?'reversal':dayChange<1?'acceleration':'outside'" stock-hunter-v4/app-hunt-v416.js
          grep -q 'sessionTsSecV413' stock-hunter-v4/app-session-v413.js
          grep -q 'candle-only recent trade evidence must be huntable' stock-hunter-v4/hunt-parity-v416.js
          grep -q 'recent quote/book movement must keep stale-trade symbol huntable' stock-hunter-v4/hunt-parity-v416.js
          grep -q 'millisecond snapshot timestamps must be normalized' stock-hunter-v4/hunt-parity-v416.js
          grep -q 'FIXTURE_COUNT: 9' stock-hunter-v4/parity/HUNT_PARITY_AUDIT_2026-09-17.md
          grep -q 'PROOF_SCOPE: FROZEN_FIXTURES_NOT_EXHAUSTIVE' stock-hunter-v4/parity/HUNT_PARITY_AUDIT_2026-09-17.md
