name: RC1.5 Release Record Check

on:
  pull_request:
    paths:
      - 'PRODUCTION_RELEASE_RC1_5.md'
      - 'AVAN_CURRENT_STATE.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RC1.5 release record
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RC1.5 — Production Released' PRODUCTION_RELEASE_RC1_5.md
          grep -q 'RC1.5 = Production Released' AVAN_CURRENT_STATE.md
          grep -q 'd5f3c704e81d359ae86c505d12fbc9df8d8f0d14' PRODUCTION_RELEASE_RC1_5.md
          grep -q 'avan-prod-rc1-5-v1' PRODUCTION_RELEASE_RC1_5.md
          grep -q 'Production HTTP Smoke' PRODUCTION_RELEASE_RC1_5.md
          echo 'RC1.5 release record: PASS'
