name: RC1.5 Production Promotion Builder v2

on:
  push:
    branches:
      - release/rc15-production-promotion-v2
    paths:
      - .github/workflows/rc15-production-promotion-v2.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/rc15-production-promotion-v2
          fetch-depth: 0

      - name: Build exact Production runtime from vetted Staging v94
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_BEFORE="$(sha256sum config.js | awk '{print $1}')"

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const stagingRoot = 'avan-staging';
          const stagingSwPath = path.join(stagingRoot, 'sw.js');
          const sw = fs.readFileSync(stagingSwPath, 'utf8');
          const assetBlock = sw.match(/const ASSETS=\[([\s\S]*?)\];/);
          if (!assetBlock) throw new Error('STAGING_SW_ASSETS_BLOCK_MISSING');
          const matches = [...assetBlock[1].matchAll(/['"]\.\/([^'"]*)['"]/g)].map(m => m[1]);
          const topLevel = [...new Set(matches.filter(rel => rel && !rel.includes('/')))]
            .filter(rel => rel !== 'config.js' && rel !== 'sw.js');

          for (const rel of topLevel) {
            const source = path.join(stagingRoot, rel);
            if (!fs.existsSync(source) || !fs.statSync(source).isFile()) {
              throw new Error(`STAGING_RUNTIME_ASSET_MISSING:${rel}`);
            }
            fs.copyFileSync(source, rel);
          }

          fs.rmSync('src', { recursive: true, force: true });
          fs.cpSync(path.join(stagingRoot, 'src'), 'src', { recursive: true });

          const productionSw = sw
            .replace("const CACHE_PREFIX='avan-staging-rc1-';", "const CACHE_PREFIX='avan-prod-';")
            .replace(/const CACHE='avan-staging-rc1-v[^']+';/, "const CACHE='avan-prod-rc1-5-v1';");

          if (productionSw.includes("const CACHE_PREFIX='avan-staging-rc1-';") ||
              productionSw.includes("const CACHE='avan-staging-rc1-")) {
            throw new Error('PRODUCTION_SW_STAGING_IDENTITY_REMAINS');
          }
          fs.writeFileSync('sw.js', productionSw);
          NODE

          CONFIG_AFTER="$(sha256sum config.js | awk '{print $1}')"
          test "$CONFIG_BEFORE" = "$CONFIG_AFTER"
          cmp avan-staging/index.html index.html
          cmp avan-staging/src/application/company/company-context.js src/application/company/company-context.js
          cmp avan-staging/src/ui/invoices/invoice-save-hot-refresh.js src/ui/invoices/invoice-save-hot-refresh.js
          grep -q "src/ui/invoices/invoice-save-hot-refresh.js" index.html
          grep -q "const CACHE_PREFIX='avan-prod-'" sw.js
          grep -q "const CACHE='avan-prod-rc1-5-v1'" sw.js
          grep -q "if(request.mode==='navigate')" sw.js
          ! grep -q "const CACHE='avan-staging" sw.js
          ! grep -q "src/ui/money/live-money-inputs.js" sw.js
          ! grep -q "src/documents/document-viewer-v2.js" sw.js
          test ! -e tests
          test ! -e scripts

      - name: Re-run vetted Staging quality gate
        working-directory: avan-staging
        run: npm run quality

      - name: Commit Production runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/rc15-production-promotion-v2.yml' ':(exclude)avan-staging'
          if git diff --cached --quiet; then
            echo "No promotion changes produced" >&2
            exit 1
          fi
          git commit -m "release: promote RC1.5 vetted v94 runtime to Production"
          git push origin HEAD:release/rc15-production-promotion-v2
