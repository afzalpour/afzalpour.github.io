name: Stock Hunter Cloud v1 Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-hunter-cloud-v1-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stock-hunter-cloud-production
    defaults:
      run:
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COLLECTOR_KEYS_JSON: ${{ secrets.STOCK_HUNTER_COLLECTOR_KEYS_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "$COLLECTOR_KEYS_JSON" || { echo "Missing STOCK_HUNTER_COLLECTOR_KEYS_JSON" >&2; exit 1; }

      - name: Validate collector HMAC key map
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const raw = process.env.COLLECTOR_KEYS_JSON || "";
          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch {
            console.error("STOCK_HUNTER_COLLECTOR_KEYS_JSON must be valid JSON.");
            process.exit(1);
          }

          if (!parsed || Array.isArray(parsed) || typeof parsed !== "object") {
            console.error("STOCK_HUNTER_COLLECTOR_KEYS_JSON must be a JSON object.");
            process.exit(1);
          }

          const entries = Object.entries(parsed);
          if (entries.length === 0) {
            console.error("STOCK_HUNTER_COLLECTOR_KEYS_JSON must contain at least one collector.");
            process.exit(1);
          }

          const collectorIdPattern = /^[A-Za-z0-9._:-]{1,128}$/;
          for (const [collectorId, secret] of entries) {
            if (!collectorIdPattern.test(collectorId)) {
              console.error("Collector ID does not satisfy the Worker protocol contract.");
              process.exit(1);
            }
            if (typeof secret !== "string" || secret.length < 16) {
              console.error("Each collector HMAC secret must be a string with at least 16 characters.");
              process.exit(1);
            }
          }

          console.log(`Validated ${entries.length} collector key entr${entries.length === 1 ? "y" : "ies"} without exposing secret material.`);
          NODE

      - name: Install pinned Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Contract compile
        run: npm run check

      - name: Ensure R2 bucket exists
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket info stock-hunter-market-v1 --json >/dev/null 2>&1; then
            echo "R2 bucket already exists."
          else
            npx wrangler r2 bucket create stock-hunter-market-v1
            npx wrangler r2 bucket info stock-hunter-market-v1 --json >/dev/null
          fi

      - name: Ensure bounded R2 lifecycle rules
        shell: bash
        run: |
          set -euo pipefail
          rules="$(npx wrangler r2 bucket lifecycle list stock-hunter-market-v1 2>&1 || true)"
          if ! printf '%s' "$rules" | grep -Fq 'stock-hunter-raw-v1-expire-3d'; then
            npx wrangler r2 bucket lifecycle add stock-hunter-market-v1 stock-hunter-raw-v1-expire-3d raw/v1/ --expire-days 3
          fi
          if ! printf '%s' "$rules" | grep -Fq 'stock-hunter-raw-pack-v1-expire-15d'; then
            npx wrangler r2 bucket lifecycle add stock-hunter-market-v1 stock-hunter-raw-pack-v1-expire-15d packs/raw-v1/ --expire-days 15
          fi
          npx wrangler r2 bucket lifecycle list stock-hunter-market-v1

      - name: Initial Worker deploy
        run: npx wrangler deploy

      - name: Install collector HMAC key map as Worker secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COLLECTOR_KEYS_JSON" | npx wrangler secret put COLLECTOR_KEYS_JSON

      - name: Verify deployed Worker metadata
        run: npx wrangler deployments list
