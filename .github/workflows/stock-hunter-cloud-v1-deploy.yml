name: Stock Hunter Cloud v1 Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-hunter-cloud-v1-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stock-hunter-cloud-production
    defaults:
      run:
        working-directory: stock-hunter-v4/cloud-v1/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COLLECTOR_KEYS_JSON: ${{ secrets.STOCK_HUNTER_COLLECTOR_KEYS_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "$COLLECTOR_KEYS_JSON" || { echo "Missing STOCK_HUNTER_COLLECTOR_KEYS_JSON" >&2; exit 1; }

      - name: Install pinned Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Contract compile
        run: npm run check

      - name: Ensure R2 bucket exists
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket info stock-hunter-market-v1 --json >/dev/null 2>&1; then
            echo "R2 bucket already exists."
          else
            npx wrangler r2 bucket create stock-hunter-market-v1
            npx wrangler r2 bucket info stock-hunter-market-v1 --json >/dev/null
          fi

      - name: Initial Worker deploy
        run: npx wrangler deploy

      - name: Install collector HMAC key map as Worker secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COLLECTOR_KEYS_JSON" | npx wrangler secret put COLLECTOR_KEYS_JSON

      - name: Verify deployed Worker metadata
        run: npx wrangler deployments list
