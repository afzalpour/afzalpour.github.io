name: Stock Hunter CDN Probe v2
on:
  push:
    branches: [main]
    paths:
      - 'stock-hunter-v4/probe_cdn_headers.sh'
      - '.github/workflows/stock-hunter-cdn-probe-v2.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Probe CDN with full headers
        run: bash stock-hunter-v4/probe_cdn_headers.sh
