name: Stock Hunter 4.1.7 Control Plane Atomicity Contract

on:
  push:
    paths:
      - 'stock-hunter-v4/control-plane/**'
      - '.github/workflows/stock-hunter-control-plane-atomicity-v417-check.yml'
  pull_request:
    paths:
      - 'stock-hunter-v4/control-plane/**'
      - '.github/workflows/stock-hunter-control-plane-atomicity-v417-check.yml'

jobs:
  atomicity-and-concurrency-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run crash / partial-failure model drill
        run: node stock-hunter-v4/control-plane/atomicity-model-v417.cjs
      - name: Run advisory-lock / state-version contention drill
        run: node stock-hunter-v4/control-plane/concurrency-lock-drill-v417.cjs
      - name: Enforce live-proof status honesty
        run: |
          grep -q 'LIVE_DB_PROOF: PASS' stock-hunter-v4/control-plane/CONTROL_PLANE_CRASH_DRILL_2026-09-17.md
          grep -q 'DONE — model + live PostgreSQL proof PASS' stock-hunter-v4/control-plane/CONTROL_PLANE_CRASH_DRILL_2026-09-17.md
          grep -q 'START vs START: one winner' stock-hunter-v4/control-plane/CONTROL_PLANE_CRASH_DRILL_2026-09-17.md
          grep -q 'ADVANCE vs ADVANCE: one winner' stock-hunter-v4/control-plane/CONTROL_PLANE_CRASH_DRILL_2026-09-17.md
          grep -q 'ROLLBACK vs ROLLBACK: one winner' stock-hunter-v4/control-plane/CONTROL_PLANE_CRASH_DRILL_2026-09-17.md
          grep -q 'production_state_after_cleanup: CHAMPION_ONLY / 0% / kill-switch ON / state_version=1' stock-hunter-v4/control-plane/LIVE_CONTROL_PLANE_PROOF_2026-09-19.md
          echo 'control-plane-live-proof-status: PASS'
