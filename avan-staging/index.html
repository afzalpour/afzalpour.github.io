<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#3D3B8C" />
  <meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="آوان" />
<meta name="format-detection" content="telephone=no" />
    <title>آوان — مدیریت مالی و حسابداری</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="avan-favicon-32.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="auth-shell" id="authShell">
    <div class="auth-card">
      <div class="auth-logo">آ</div>
      <h1>آوان</h1>
      <p>ورود به هسته حسابداری ابری</p>
      <div class="auth-tabs"><button id="loginTab" class="active">ورود</button><button id="signupTab">ساخت حساب</button></div>
      <form id="authForm">
        <div class="field"><label>ایمیل</label><input id="authEmail" type="email" autocomplete="email" required /></div>
        <div class="field" style="margin-top:10px"><label>رمز عبور</label><input id="authPassword" type="password" minlength="6" autocomplete="current-password" required /></div>
        <button class="primary" id="authSubmit" style="width:100%;margin-top:16px">ورود</button>
        <button
  type="button"
  class="ghost"
  id="forgotPasswordBtn"
  style="width:100%;margin-top:8px"
>
  فراموشی رمز عبور
</button>
      </form>
      <div class="auth-status" id="authStatus"></div>
    </div>
  </section>

  <div class="app-shell" id="appShell" hidden>
    <main class="main">
      <header class="topbar">
        <div><div class="eyebrow" id="breadcrumb">آوان › داشبورد</div><h1 id="pageTitle">داشبورد</h1></div>
        <div class="top-actions"><button class="ghost" data-action="receipt">دریافت</button><button class="primary" data-action="payment">پرداخت</button></div>
      </header>
      <section class="content" id="content"><div class="loading">در حال اتصال به فضای مالی…</div></section>
    </main>
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">آ</div><div><strong>آوان</strong><span>Core 1.0</span></div></div>
      <nav class="nav" id="nav">
        <button data-page="dashboard" class="active"><span>⌂</span>داشبورد</button>
        <div class="nav-label">ثبت مالی</div>
<button data-action="receipt"><span>↓</span>دریافت</button>
<button data-action="payment"><span>↑</span>پرداخت</button>
<button data-action="transfer"><span>↔</span>انتقال</button>
<button data-page="invoices"><span>▤</span>فاکتورها</button>
<button data-page="journal"><span>≡</span>اسناد حسابداری</button>
<button data-page="documents"><span>▧</span>اسناد هوشمند</button>        <div class="nav-label">اطلاعات پایه</div>
        <button data-page="accounts"><span>▦</span>حساب‌ها</button><button data-page="parties"><span>◎</span>طرف‌حساب‌ها</button>
        <div class="nav-label">گزارش</div>
        <button data-page="reports"><span>▥</span>گزارش‌ها</button><button data-page="settings"><span>⚙</span>تنظیمات</button>
      </nav>
      <div class="sidebar-foot"><div class="status-dot"></div><span id="cloudStatus">Supabase متصل</span></div>
    </aside>
  </div>
  <nav class="bottom-nav" id="bottomNav" hidden>
    <button data-page="dashboard" class="active"><span>⌂</span>خانه</button><button data-page="accounts"><span>▦</span>حساب‌ها</button><button data-action="quick" class="fab"><span>＋</span>ثبت</button><button data-page="reports"><span>▥</span>گزارش</button><button data-page="settings"><span>⚙</span>تنظیمات</button>
  </nav>
  <div class="modal-backdrop" id="modalBackdrop" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" aria-live="polite"></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body></html>
