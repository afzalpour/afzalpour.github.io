<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود — شکارچی سهم 4.1.7</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="extra.css?v=4.1.7-auth"><link rel="stylesheet" href="auth-v417.css?v=1"></head><body><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><img src="icon.svg" alt=""><div><h1>شکارچی سهم <span>۴.۱.۷</span></h1><p>ورود و حساب شخصی — محیط آزمایشی نسخه جدید</p></div></div><div id="alreadySignedIn" class="auth-session" hidden>اکنون با <b id="alreadySignedInEmail"></b> وارد هستی. <button id="continueSession" type="button">ادامه</button><button id="signOutHere" type="button">خروج</button></div><div class="auth-tabs"><button type="button" data-auth-tab="signin" class="active">ورود</button><button type="button" data-auth-tab="signup">ثبت‌نام</button><button type="button" data-auth-tab="recovery">بازیابی رمز</button></div><form id="authForm" class="auth-form"><label id="displayNameWrap" hidden>نام نمایشی<input id="displayName" autocomplete="name"></label><label>ایمیل<input id="email" type="email" autocomplete="email" required></label><label id="passwordWrap">رمز عبور<input id="password" type="password" autocomplete="current-password" minlength="8"></label><label id="newPasswordWrap" hidden>رمز جدید<input id="newPassword" type="password" autocomplete="new-password" minlength="8"></label><button id="authSubmit" type="submit">ورود</button></form><div id="authMessage" class="auth-message" hidden></div></section></main><script src="config.js?v=4.1.6"></script><script type="module" src="app-auth-v417.js?v=1"></script></body></html>
