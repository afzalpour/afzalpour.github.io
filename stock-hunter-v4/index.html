<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>شکارچی سهم</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=4.1.0">
  <link rel="stylesheet" href="extra.css?v=4.1.0">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <img class="brand-icon" src="icon.svg" alt="نشان شکارچی سهم">
      <div><h1>شکارچی سهم <span>۴.۱.۰</span></h1><p>سامانه هوشمند پایش جامع بازار سرمایه</p><small class="designer">طراح: دکتر نیما افضل پور</small></div>
    </div>
    <div class="top-actions"><span id="feedBadge" class="feed-badge bad">در حال بررسی وضعیت بازار</span><a class="top-link" href="methodology.html" target="_blank" rel="noopener">راهنمای محاسبات</a><button id="soundBtn">🔔 هشدار روشن</button></div>
  </header>
  <main class="workspace">
    <section class="summary-row">
      <article><span>شکار ویژه</span><b id="specialCount">۰</b></article>
      <article><span>هشدار فوری</span><b id="urgentCount">۰</b></article>
      <article><span>ورود نهایی</span><b id="buyCount">۰</b></article>
      <article class="top-pick"><span>شکار برتر</span><b id="topSymbol">—</b><small id="topMeta">—</small></article>
      <article class="feed-info"><span>وضعیت بازار</span><b id="feedState">در حال بررسی…</b><small id="scanTimes">—</small></article>
    </section>
    <section class="toolbar">
      <input id="search" placeholder="جست‌وجو در تمام نمادهای بازار سرمایه…" autocomplete="off">
      <select id="hunt"><option value="">همه شکارها</option><option>شکار ویژه</option><option>هشدار فوری</option><option>شکار زودهنگام</option><option>مستعد تداوم</option><option>رصد</option><option>عادی</option></select>
      <select id="decision"><option value="">همه تصمیم‌ها</option><option>ورود قوی</option><option>ورود اولیه</option><option>صبر برای تأیید</option><option>تحت نظر</option><option>عدم ورود</option></select>
      <select id="pageSize" title="تعداد ردیف"><option value="15">۱۵ ردیف</option><option value="25" selected>۲۵ ردیف</option><option value="50">۵۰ ردیف</option><option value="100">۱۰۰ ردیف</option></select>
      <button id="columnsBtn">☷ ستون‌ها</button><button id="refreshBtn">↻ تازه‌سازی</button>
    </section>
    <section id="alertBox" class="alert-box" hidden></section>
    <section class="table-panel"><div class="table-wrap"><table id="mainTable"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="pager"><button id="prevPage">صفحه قبل</button><span id="pageInfo">—</span><button id="nextPage">صفحه بعد</button></div></section>
    <section id="mobileList" class="mobile-list"></section>
  </main>
</div>
<aside id="columnPanel" class="side-panel" aria-hidden="true"><div class="side-head"><div><b>انتخاب ستون‌ها</b><small>چیدمان دلخواه شما در همین دستگاه ذخیره می‌شود.</small></div><button id="closeColumns">×</button></div><div id="columnOptions" class="column-options"></div><div class="side-actions"><button id="defaultColumns">چیدمان پیشنهادی</button><button id="allColumns">نمایش همه</button></div></aside>
<div id="panelBackdrop" class="backdrop" hidden></div>
<dialog id="detailDialog"><div class="detail-head"><div><h2 id="dSymbol">—</h2><p id="dCompany">—</p></div><div class="detail-actions"><button id="printDetailBtn" class="print-detail-btn">چاپ / ذخیره PDF</button><button id="closeDetail" aria-label="بستن">×</button></div></div><div id="detailBody"></div></dialog>
<script src="config.js?v=4.1.0"></script><script src="app-core.js?v=4.1.0"></script><script src="app-forecast.js?v=4.1.0"></script><script src="app-runtime.js?v=4.1.0"></script><script src="app-universe.js?v=4.1.0"></script><script src="app-hotfix-v410.js?v=4.1.0"></script><script src="app-integrated-v410.js?v=4.1.0"></script><script src="app-integrated-summary-v410.js?v=4.1.0"></script>
</body></html>
